# The live site (serenity.soulplexstudios.tech) is built by Netlify from main.
# Netlify detects Next.js and adds its own runtime for the server-rendered pages.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Named explicitly: this site was created as plain static files, and without
# this line Netlify builds the app but serves nothing.
[[plugins]]
  package = "@netlify/plugin-nextjs"
